services:
  db:
    image: postgres:15-alpine
    container_name: rms-db-prod
    environment:
      POSTGRES_DB: rms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data-prod:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  backend:
    build: ./backend
    container_name: rms-backend-prod
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/rms_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - db
    restart: always

  frontend:
    build: ./frontend
    container_name: rms-frontend-prod
    ports:
      - "80:80"
      - "81:81"
    depends_on:
      - backend
    restart: always
