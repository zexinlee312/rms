spring:
  application:
    name: rms-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/rms_db
    username: postgres
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
